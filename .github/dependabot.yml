# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "ci"
      include: "scope"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/utils"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    # Must stay above `minimumReleaseAge` in utils/pnpm-workspace.yaml, otherwise
    # pnpm refuses to install the version Dependabot pinned.
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      symfony:
        patterns:
          - "symfony/*"
      phpstan:
        patterns:
          - "phpstan/*"
