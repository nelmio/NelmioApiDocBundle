# from doctrine/instantiator:
# https://github.com/doctrine/instantiator/blob/97aa11bb71ad6259a8c5a1161b4de2d6cdcc5501/.github/workflows/continuous-integration.yml

name: CI

on:
  pull_request:
    branches:
      - "*.x"
  push:
    branches:
      - "*.x"

env:
  fail-fast: true

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - 7.4
          - 8.1
          - 8.2
          - 8.3
          - 8.4
          - 8.5
        symfony-require:
          - "5.4"
          - "6.4"
          - "7.1"
          - "7.2"
          - "7.3"
          - "7.4"
        composer-flags:
          - ""
        doctrine-annotations:
          - true
          - false
        include:
          - php-version: 7.4
            symfony-require: "5.4"
            composer-flags: "--prefer-lowest"
        exclude:
          - symfony-require: "5.4"
            doctrine-annotations: false
          - symfony-require: "6.4"
            doctrine-annotations: false

          - symfony-require: "7.1"
            doctrine-annotations: true
          - symfony-require: "7.2"
            doctrine-annotations: true
          - symfony-require: "7.3"
            doctrine-annotations: true
          - symfony-require: "7.4"
            doctrine-annotations: true

          # Symfony 6.4: Requires: PHP 8.1.0 or higher
          - symfony-require: "6.4"
            php-version: 7.4

          # Symfony 7.x: Requires: PHP 8.2.0 or higher
          - symfony-require: "7.1"
            php-version: 7.4
          - symfony-require: "7.1"
            php-version: 8.1
          - symfony-require: "7.2"
            php-version: 7.4
          - symfony-require: "7.2"
            php-version: 8.1
          - symfony-require: "7.3"
            php-version: 7.4
          - symfony-require: "7.3"
            php-version: 8.1
          - symfony-require: "7.4"
            php-version: 7.4
          - symfony-require: "7.4"
            php-version: 8.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install PHP with coverage
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer, flex
          coverage: pcov

      - name: Setup dependencies
        uses: ./.github/workflows/common/composer-install
        with:
          symfony-version: ${{ matrix.symfony-require }}
          install-doctrine-annotations: ${{ matrix.doctrine-annotations }}
          composer-flags: ${{ matrix.composer-flags }}

      - name: PHPUnit Tests
        run: | 
          vendor/bin/phpunit \
          --configuration phpunit.xml.dist \
          --log-junit=junit-${{ matrix.php-version }}-${{ matrix.symfony-require }}-${{ matrix.doctrine-annotations }}${{ matrix.composer-flags }}.xml \
          --coverage-clover=coverage-${{ matrix.php-version }}-${{ matrix.symfony-require }}-${{ matrix.doctrine-annotations }}${{ matrix.composer-flags }}.xml \
          --coverage-filter=src/

      - uses: actions/upload-artifact@v5
        if: ${{ matrix.php-version != '7.4' }}
        with:
          name: phpunit-${{ matrix.php-version }}-${{ matrix.symfony-require }}-${{ matrix.doctrine-annotations }}${{ matrix.composer-flags }}
          path: |
            coverage*.xml
            junit*.xml
          if-no-files-found: error
          retention-days: 2

  codecov:
    name: Codecov
    runs-on: ubuntu-22.04

    needs: phpunit
    timeout-minutes: 5

    if: github.event.pull_request.user.login != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Download artifacts
        uses: actions/download-artifact@v6

      - name: Upload test results to Codecov.io
        uses: codecov/test-results-action@v1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload code coverage to Codecov.io
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install PHP without coverage
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer, flex
          coverage: none

      - name: Setup dependencies
        uses: ./.github/workflows/common/composer-install
        with:
          symfony-version: "7.2.*"
          install-doctrine-annotations: false

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer check -v --diff

  phpstan:
    name: PHPStan
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install PHP without coverage
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer, flex
          coverage: none

      - name: Setup dependencies
        uses: ./.github/workflows/common/composer-install
        with:
          symfony-version: "7.2.*"
          install-doctrine-annotations: false

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress --no-interaction
